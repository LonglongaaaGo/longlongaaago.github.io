<dialog class="wl-video-dialog" id="video-player" aria-labelledby="video-player-title">
  <div class="wl-video-dialog-header">
    <h2 id="video-player-title">Video</h2>
    <button type="button" class="wl-video-close" aria-label="Close video" title="Close video"><i class="fas fa-times" aria-hidden="true"></i></button>
  </div>
  <div class="wl-video-player-frame"></div>
  <a class="wl-video-external" target="_blank" rel="noopener noreferrer">Open on YouTube <i class="fas fa-external-link-alt" aria-hidden="true"></i></a>
</dialog>
